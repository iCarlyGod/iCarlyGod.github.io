---
layout: default
---
<div style="padding: 10px;">
    <div>
        <h2 style="color: black;font-size: 32px; display: inline-block;">{{ page.title }}</h2>
        <div style="font-size: normal; margin-left: 20px; display: inline-block;"> </div>
        {% for tag in page.tags %}
        <div style="display: inline-block; background-color: rgb(0, 157, 255); color: black; border-radius:10px; padding-left: 5px; padding-right: 5px;font-size: 12px; vertical-align: text-top;">{{tag}}</div>
        {% endfor %}
    </div>

    <div><i>Posted on {{ page.date | date: "%B %-d %Y" }}</i></div>

    <br style="font-style: normal;">{{content}}<br>

    <hr>
    <small style="font-size:x-small;"><em>End of post</em></small>
    
</div>
